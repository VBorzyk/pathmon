name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: Статический анализ
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - name: Сборка
        run: go build ./...
